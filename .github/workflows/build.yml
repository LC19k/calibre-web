name: Build and Publish Calibre-Web

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * *"   # Build nightly at 06:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          TAG=$(date +"%Y-%m-%d-%H%M")
          echo "TAG=$TAG" >> $GITHUB_ENV
          docker build -t ghcr.io/${{ github.repository_owner }}/calibre-web:$TAG .

      - name: Push versioned tag
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/calibre-web:${TAG}

      - name: Tag latest
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/calibre-web:${TAG} \
                     ghcr.io/${{ github.repository_owner }}/calibre-web:latest
          docker push ghcr.io/${{ github.repository_owner }}/calibre-web:latest
